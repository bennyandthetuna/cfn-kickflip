name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cahc: true
      - run: uv sync --locked
      - run: uv run ruff check

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest
      - name: Verify wheel packaging and CLI entry points
        run: |
          uv build
          uv run --isolated --no-project --with dist/*.whl python -c "import cfn_flip, cfn_clean, cfn_tools"
          uv run --isolated --no-project --with dist/*.whl cfn-kickflip --help
          uv run --isolated --noproject --with dist/*.whl cfn-flip --help
