name: Release to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-pypi:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cfn-kickflip
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build
      - name: Smoke-test built wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c "import cfn_flip, cfn_clean, cfn_tools"
          uv run --isolated --no-project --with dist/*.whl cfn_kickflip --version
          uv run --isolated --no-project --with dist/*.whl cfn_flip --version
      - uses: pypa/gh-action-pypi-publish@release/v1
      